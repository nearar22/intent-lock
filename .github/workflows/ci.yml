name: IntentLock CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    name: Contract lint and adversarial tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: genvm-lint contracts/intent_lock.py
      - run: python -m pytest tests/direct/test_intent_lock.py -q

  frontend:
    name: Frontend lint, tests, and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test --workspace frontend
      - run: npm run build
